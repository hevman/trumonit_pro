name: Verify Trumonit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trumonit_test
          POSTGRES_USER: trumonit
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trumonit -d trumonit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://trumonit:ci-test-only-password@localhost:5432/trumonit_test
      TEST_DATABASE_URL: postgresql+psycopg://trumonit:ci-test-only-password@localhost:5432/trumonit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FastAPI and testing dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Apply all PostgreSQL schema migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Test workflows, isolation and migrated PostgreSQL
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Build Next.js
        working-directory: frontend
        run: npm run build
