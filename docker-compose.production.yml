name: TruMonit

x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  depends_on:
    - db
    - redis
  networks:
    - TruMonit
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    expose:
      - "80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - TruMonit
      - reverse_proxy_network
    environment:
      - VIRTUAL_HOST=trumonit.pro,www.trumonit.pro
      - LETSENCRYPT_HOST=trumonit.pro,www.trumonit.pro
    restart: unless-stopped

  app:
    <<: *app-common
    command: >
      sh -lc "mkdir -p /var/www/html/storage/framework/cache /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/framework/testing /var/www/html/bootstrap/cache
      && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
      && chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache
      && exec php-fpm"

  queue:
    <<: *app-common
    command: php artisan queue:work --queue=${WIDS_WORKER_QUEUES:-wids-high,wids,wids-low,default} --sleep=1 --tries=1 --timeout=0

  scheduler:
    <<: *app-common
    command: php artisan schedule:work

  playwright:
    build:
      context: ./docker/playwright
      dockerfile: Dockerfile
    shm_size: "1gb"
    environment:
      ALLOWED_PORTS: "${WIDS_ALLOWED_PORTS:-80,443}"
    networks:
      - TruMonit
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: TruMonit
      POSTGRES_USER: TruMonit
      POSTGRES_PASSWORD: TruMonit
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - TruMonit
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - TruMonit
    command: redis-server --appendonly yes
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: TruMonit
      MINIO_ROOT_PASSWORD: TruMonit
    volumes:
      - minio-data:/data
    networks:
      - TruMonit
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  minio-data:

networks:
  TruMonit:
    driver: bridge
  reverse_proxy_network:
    external: true

